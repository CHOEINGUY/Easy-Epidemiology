# CI Pipeline - quality ratchet for v3.0
name: CI Pipeline

on:
  push:
    branches: [main, develop, v3.0]
  pull_request:
    branches: [main, develop, v3.0]

env:
  NODE_VERSION: "20"

jobs:
  core-lint:
    name: 🔍 Core Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run core ESLint
        run: npm run lint:core

  legacy-lint:
    name: 🧹 Legacy Lint Debt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧹 Report legacy lint debt
        run: npm run lint:legacy

  strict-core-typecheck:
    name: 🧷 Strict Core Typecheck
    runs-on: ubuntu-latest
    needs: core-lint
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧷 Run strict core typecheck
        run: npm run typecheck:strict-core

  unit-test:
    name: 🧪 Unit Tests + Coverage Gate
    runs-on: ubuntu-latest
    needs: core-lint
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm test -- --coverage --runInBand

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: [core-lint, strict-core-typecheck, unit-test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build:noauth

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e-test:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🌐 Start server and run E2E tests
        run: |
          npx serve -s dist -l 8081 > /tmp/easy-epi-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 5
          npm run test:e2e

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
